name = "danielflynn-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://danielflynn.site"

[[d1_databases]]
binding = "DB"
database_name = "danielflynn-db"
database_id = "88bb2758-ff58-4732-b523-495a3a2fe9d1"

# Per-IP rate limits (see src/ratelimit.js). period must be 10 or 60 seconds.
[[ratelimits]]
name = "CHECKOUT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "DOWNLOAD_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "HELLO_LIMITER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# Private bucket for purchasable files. Create it before deploying:
#   npx wrangler r2 bucket create danielflynn-store
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "danielflynn-store"
