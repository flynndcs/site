name = "danielflynn-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://danielflynn.site"

[[d1_databases]]
binding = "DB"
database_name = "danielflynn-db"
database_id = "88bb2758-ff58-4732-b523-495a3a2fe9d1"

# Private bucket for purchasable files. Create it before deploying:
#   npx wrangler r2 bucket create danielflynn-store
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "danielflynn-store"
