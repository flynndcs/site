<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shapes</title>
<style>
  :root { --bg:#14151a; --panel:#1d1f27; --line:#2d303b; --text:#e6e8ee; --dim:#8b90a0; --accent:#6c8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px system-ui,sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
  header, footer { background:var(--panel); border-color:var(--line); display:flex; gap:8px; align-items:center; padding:8px 12px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  footer { border-top:1px solid var(--line); }
  main { display:grid; grid-template-columns:1fr 280px; min-height:0; }
  #toast { position:absolute; left:50%; top:22px; transform:translateX(-50%); white-space:nowrap; background:#272a35; border:1px solid var(--accent); color:var(--text); padding:7px 14px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .15s; z-index:5; }
  #toast.show { opacity:1; }
  canvas:focus { outline:none; }
  #stage { position:relative; display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; min-height:0; }
  canvas { background:#0b0b0f; max-width:100%; max-height:100%; aspect-ratio:16/9; border:1px solid var(--line); touch-action:none; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto; }
  button, select, input { font:inherit; color:var(--text); background:#272a35; border:1px solid var(--line); border-radius:5px; padding:5px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=range] { padding:0; }
  input[type=color] { padding:0; width:32px; height:26px; }
  input[type=number] { width:70px; }
  label.file { cursor:pointer; background:var(--accent); padding:5px 10px; border-radius:5px; color:#fff; }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  h3 { margin:14px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .row > span { width:56px; color:var(--dim); }
  .bind { border:1px solid var(--line); border-radius:6px; padding:6px; margin-bottom:6px; }
  .bind select { width:48%; }
  .bind input[type=range] { width:calc(100% - 30px); }
  #meters { display:flex; gap:3px; align-items:flex-end; height:26px; }
  #meters div { width:8px; background:var(--accent); min-height:2px; }
  #timeline { flex:1; min-width:160px; height:30px; position:relative; }
  #seek { -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:8px; margin:0; padding:0; position:absolute; left:0; top:11px; }
  #seek::-webkit-slider-runnable-track { height:4px; background:#2d303b; border-radius:2px; }
  #seek::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); margin-top:-4px; }
  #seek::-moz-range-track { height:4px; background:#2d303b; border-radius:2px; }
  #seek::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--accent); }
  #markers { position:absolute; inset:0; pointer-events:none; }
  .mk { position:absolute; top:0; bottom:0; width:11px; margin-left:-5px; cursor:ew-resize; pointer-events:auto; touch-action:none; }
  .mk::after { content:''; position:absolute; left:4px; top:0; bottom:0; width:2px; background:var(--c); opacity:.75; border-radius:1px; }
  .mk::before { content:''; position:absolute; left:1px; top:0; width:9px; height:6px; background:var(--c); opacity:.75; border-radius:2px; }
  .mk.flash::after { animation:mkflash .7s ease-out; }
  @keyframes mkflash { 0% { box-shadow:0 0 0 0 #fff, 0 0 14px 4px #fff; transform:scaleX(4); } 100% { box-shadow:0 0 0 0 transparent; transform:scaleX(1); } }
  .mk.mine::after, .mk.mine::before { opacity:1; }
  .mk.sel::after { background:#fff; width:3px; left:4px; opacity:1; }
  .mk.sel::before { background:#fff; opacity:1; }
  .evrow { border:1px solid var(--line); border-radius:6px; padding:6px; margin-bottom:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .chips { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px; }
  .chip { width:24px; height:22px; padding:0; font-size:12px; line-height:1; background:var(--c); color:#000; border:2px solid transparent; opacity:.35; text-shadow:0 0 2px #fff; }
  .chip.inc { opacity:1; border-color:#fff; }
  .chip.all { width:auto; padding:0 6px; background:#272a35; color:var(--dim); opacity:1; border:1px solid var(--line); text-shadow:none; }
  .evrow.sel { border-color:#fff; }
  .evrow input[type=number] { width:70px; }
  .evrow select { flex:1; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<header>
  <label class="file">Upload audio<input id="file" type="file" accept="audio/*" hidden></label>
  <span id="fname" class="dim">no file</span>
  <div class="sep"></div>
  <button data-tool="select" title="Select / move (V)">Select</button>
  <button data-tool="pen" class="on" title="Pen: click and drag to draw (P)">Pen</button>
  <button data-tool="rect" title="Rectangle (R)">Rectangle</button>
  <button data-tool="ellipse" title="Ellipse (E)">Ellipse</button>
  <button data-tool="triangle" title="Triangle (T)">Triangle</button>
  <div class="sep"></div>
  <button id="save">Save JSON</button>
  <label class="file" style="background:#272a35">Load JSON<input id="load" type="file" accept="application/json" hidden></label>
</header>
<main>
  <div id="stage"><canvas id="cv" width="960" height="540" tabindex="0"></canvas><div id="toast" role="status"></div></div>
  <aside id="inspector"></aside>
</main>
<footer>
  <button id="play" style="width:70px">Play</button>
  <div id="timeline"><input id="seek" type="range" min="0" max="1000" value="0"><div id="markers"></div></div>
  <span id="time" class="dim">0:00 / 0:00</span>
  <div id="meters" title="bass / mid / treble / level / beat"><div></div><div></div><div></div><div></div><div></div></div>
</footer>

<script>
'use strict';
const W = 960, H = 540;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

const BANDS = ['bass', 'mid', 'treble', 'level', 'beat'];
const PROPS = { scale:'Scale', rotate:'Rotate', opacity:'Opacity', x:'Offset X', y:'Offset Y', hue:'Hue shift' };

const state = {
  shapes: [], selIds: [],
  // `sel` is the id when exactly one shape is selected (inspector edits it); assigning it selects just that shape
  get sel() { return this.selIds.length === 1 ? this.selIds[0] : null; },
  set sel(v) { this.selIds = v == null ? [] : [v]; },
  tool: 'pen', nextId: 1, events: [], selEvent: null, nextEv: 1 };
const EVENT_ACTIONS = { toggle: 'Toggle visible', show: 'Show', hide: 'Hide' };
const FADE = 0.15;   // seconds
// An event targets one or more shapes (shapeIds). Visibility over time, derived only from events (so scrubbing is deterministic).
// Starts visible unless the shape's first event is Show. Returns 0..1 (fades over FADE after a change).
function visAlpha(s, t) {
  const evs = state.events.filter(e => e.shapeIds.includes(s.id)).sort((a, b) => a.time - b.time);
  let vis = !(evs.length && evs[0].action === 'show'), since = -Infinity;
  for (const e of evs) {
    if (e.time > t) break;
    const next = e.action === 'toggle' ? !vis : e.action === 'show';
    if (next !== vis) { vis = next; since = e.time; }
  }
  const k = Math.min(1, (t - since) / FADE);
  return vis ? k : 1 - k;
}
function deleteShape(id) {
  state.shapes = state.shapes.filter(s => s.id !== id);
  state.events.forEach(e => e.shapeIds = e.shapeIds.filter(x => x !== id));
  state.events = state.events.filter(e => e.shapeIds.length);   // an event with no shapes left does nothing
  state.selIds = state.selIds.filter(x => x !== id);
  state.selEvent = null;
}
// New events alternate: Show by default, but Hide when the shape's previous event was Show.
// (For a group, Hide only if every shape's previous event was Show.)
function defaultAction(shapeIds, time) {
  const last = id => state.events.filter(e => e.shapeIds.includes(id) && e.time <= time).sort((a, b) => b.time - a.time)[0];
  return shapeIds.every(id => (last(id) || {}).action === 'show') ? 'hide' : 'show';
}
function addEvent() {
  console.debug('[M] addEvent', { selected: state.selIds.length, duration: audio.duration, time: audio.currentTime, playing: !audio.paused, focus: document.hasFocus(), active: document.activeElement && document.activeElement.tagName });
  if (!audio.duration) return toast('Upload audio first');
  if (!state.selIds.length) return toast('Select a shape first, then press M');
  // with several shapes selected, one event covers them all
  const time = +audio.currentTime.toFixed(2), shapeIds = [...state.selIds];
  const e = { id: state.nextEv++, shapeIds, time, action: defaultAction(shapeIds, time) };
  state.events.push(e); state.selEvent = e.id; renderInspector();
  const mk = document.querySelector(`.mk[data-id="${e.id}"]`); if (mk) mk.classList.add('flash');
  toast(`Event added at ${e.time.toFixed(1)}s: ${e.action} · ${e.shapeIds.length === 1 ? '1 shape' : e.shapeIds.length + ' shapes'}`);
}
const audio = new Audio();
audio.crossOrigin = 'anonymous';
let actx, analyser, freq, hasAudio = false;
const bands = { bass:0, mid:0, treble:0, level:0, beat:0 };
let bassAvg = 0;
const peaks = {}, lows = {};

// ---------- audio ----------
function initAudio() {
  if (actx) return;
  actx = new AudioContext();
  const src = actx.createMediaElementSource(audio);
  analyser = actx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  src.connect(analyser); analyser.connect(actx.destination);
  freq = new Uint8Array(analyser.frequencyBinCount);
}
function avgRange(lo, hi) {
  const hz = actx.sampleRate / analyser.fftSize;
  const a = Math.max(1, Math.floor(lo / hz)), b = Math.min(freq.length - 1, Math.ceil(hi / hz));
  let s = 0; for (let i = a; i <= b; i++) s += freq[i];
  return s / (b - a + 1) / 255;
}
function updateBands() {
  if (!analyser || audio.paused) { for (const k of BANDS) bands[k] *= 0.9; return; }
  analyser.getByteFrequencyData(freq);
  // normalize each band to its own recent dynamic range so quiet bands (treble) and steady music still move
  for (const [k, lo, hi] of [['bass', 20, 150], ['mid', 150, 1500], ['treble', 1500, 8000], ['level', 20, 16000]]) {
    const raw = avgRange(lo, hi);
    // floor drops instantly to quiet moments and creeps up; peak decays toward the floor
    lows[k] = raw < (lows[k] ?? raw) ? raw : (lows[k] ?? raw) + (raw - (lows[k] ?? raw)) * 0.003;
    peaks[k] = Math.max(raw, lows[k] + ((peaks[k] ?? raw) - lows[k]) * 0.997);
    bands[k] = Math.min(1, Math.max(0, (raw - lows[k]) / Math.max(peaks[k] - lows[k], 0.01)));
  }
  bassAvg += (bands.bass - bassAvg) * 0.05;
  const hit = Math.max(0, bands.bass - bassAvg - 0.04) * 6;
  bands.beat = Math.max(bands.beat * 0.88, Math.min(1, hit));
}

// ---------- shapes ----------
const randColor = () => '#' + Math.floor(Math.random() * 0x777777 + 0x777777).toString(16).padStart(6, '0');
function makeShape(type, x, y, w, h) {
  return { id: state.nextId++, type, x, y, w, h, rot: 0, opacity: 1, fill: randColor(), bindings: [] };
}

// ---------- pen strokes ----------
// Ramer-Douglas-Peucker (iterative): drop points within eps px of the simplified line
function rdp(pts, eps) {
  if (pts.length < 3) return pts;
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    let md = 0, mi = -1;
    for (let i = a + 1; i < b; i++) {
      const d = segDist(pts[i], pts[a], pts[b]);
      if (d > md) { md = d; mi = i; }
    }
    if (md > eps) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2)) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
// raw world-space points -> a path shape whose pts are normalized to its bounding box (-0.5..0.5)
function finishStroke(d) {
  const pts = rdp(d.pts, 1.5);
  if (pts.length < 2) return null;   // a click with no drag
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const w = Math.max(maxx - minx, 8), h = Math.max(maxy - miny, 8), cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
  const s = makeShape('path', cx, cy, w, h);
  s.fill = d.color; s.lw = d.lw;
  s.pts = pts.map(q => [(q[0] - cx) / w, (q[1] - cy) / h]);
  return s;
}
// smooth curve through the midpoints of the (simplified) polyline
function strokePath(P) {
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++)
    ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}
const toLocalPts = s => s.pts.map(([x, y]) => [x * s.w, y * s.h]);

const sel = () => state.shapes.find(s => s.id === state.sel);
const selShapes = () => state.shapes.filter(s => state.selIds.includes(s.id));
// the shape as currently drawn (audio bindings applied) so clicks and outlines follow it during playback
function view(s) { const e = effective(s, true); return { ...s, x: e.x, y: e.y, rot: e.rot, w: s.w * e.sc, h: s.h * e.sc }; }
// axis-aligned bounds of a (possibly rotated) shape: [minx, miny, maxx, maxy]
function aabb(s) {
  const a = s.rot * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
  const xs = [], ys = [];
  for (const [dx, dy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const x = dx * s.w / 2, y = dy * s.h / 2;
    xs.push(s.x + x * c - y * n); ys.push(s.y + x * n + y * c);
  }
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

function effective(s, animate) {
  const e = { x: s.x, y: s.y, sc: 1, rot: s.rot, op: s.opacity, hue: 0 };
  if (!animate) return e;
  for (const b of s.bindings) {
    const v = bands[b.band] * b.amount;
    switch (b.prop) {
      case 'scale': e.sc += v; break;
      case 'rotate': e.rot += v * 180; break;
      case 'opacity': e.op += v; break;
      case 'x': e.x += v * 200; break;
      case 'y': e.y += v * 200; break;
      case 'hue': e.hue += v * 180; break;
    }
  }
  e.sc = Math.max(0.02, e.sc); e.op = Math.min(1, Math.max(0, e.op));
  return e;
}
function path(s, w, h) {
  ctx.beginPath();
  if (s.type === 'rect') ctx.rect(-w / 2, -h / 2, w, h);
  else if (s.type === 'ellipse') ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
  else { ctx.moveTo(0, -h / 2); ctx.lineTo(w / 2, h / 2); ctx.lineTo(-w / 2, h / 2); ctx.closePath(); }
}
function hueShift(hex, deg) {
  if (!deg) return hex;
  let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, sat = 0;
  if (d) {
    sat = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return `hsl(${(h + deg + 360) % 360} ${sat * 100}% ${l * 100}%)`;
}

function draw() {
  const animate = !audio.paused, t = audio.currentTime || 0;
  ctx.clearRect(0, 0, W, H);
  if (!state.shapes.length && !drag) {
    ctx.fillStyle = '#4a4e5c'; ctx.font = '20px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Click and drag to draw', W / 2, H / 2);
  }
  for (const s of state.shapes) {
    const va = visAlpha(s, t);
    if (animate && va <= 0) continue;
    const e = effective(s, animate);   // while paused, hidden shapes stay visible as 25% ghosts so they can be edited
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(e.rot * Math.PI / 180); ctx.scale(e.sc, e.sc);
    ctx.globalAlpha = e.op * (animate ? va : 0.25 + 0.75 * va);
    if (s.type === 'path') {
      ctx.strokeStyle = hueShift(s.fill, e.hue); ctx.lineWidth = s.lw;
      ctx.lineJoin = ctx.lineCap = 'round';
      strokePath(toLocalPts(s)); ctx.stroke();
    } else {
      ctx.fillStyle = hueShift(s.fill, e.hue);
      path(s, s.w, s.h); ctx.fill();
    }
    ctx.restore();
  }
  if (drag && drag.mode === 'pen' && drag.draft.pts.length > 1) {   // stroke in progress
    ctx.strokeStyle = drag.draft.color; ctx.lineWidth = drag.draft.lw; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath(); drag.draft.pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke();
  }
  {   // selection outlines (+ resize handle when exactly one shape is selected and we're paused)
    const chosen = selShapes().map(o => animate ? view(o) : o);
    for (const s of chosen) {
      ctx.save();
      ctx.translate(s.x, s.y); ctx.rotate(s.rot * Math.PI / 180);
      ctx.strokeStyle = '#6c8cff'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
      ctx.strokeRect(-s.w / 2, -s.h / 2, s.w, s.h);
      if (chosen.length === 1 && !animate) { ctx.setLineDash([]); ctx.fillStyle = '#fff'; ctx.fillRect(s.w / 2 - 5, s.h / 2 - 5, 10, 10); }
      ctx.restore();
    }
    if (chosen.length > 1) {   // group box
      const bs = chosen.map(aabb), x0 = Math.min(...bs.map(b => b[0])), y0 = Math.min(...bs.map(b => b[1]));
      ctx.strokeStyle = 'rgba(108,140,255,.6)'; ctx.lineWidth = 1; ctx.setLineDash([]);
      ctx.strokeRect(x0 - 4, y0 - 4, Math.max(...bs.map(b => b[2])) - x0 + 8, Math.max(...bs.map(b => b[3])) - y0 + 8);
    }
    if (drag && drag.mode === 'marquee') {
      const [x0, y0, x1, y1] = marqueeRect(drag);
      ctx.fillStyle = 'rgba(108,140,255,.12)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      ctx.strokeStyle = '#6c8cff'; ctx.lineWidth = 1; ctx.setLineDash([]); ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    }
  }
}

// ---------- pointer interaction ----------
function pos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height };
}
function local(s, p) {   // world -> shape local space
  const a = -s.rot * Math.PI / 180, dx = p.x - s.x, dy = p.y - s.y;
  return { x: dx * Math.cos(a) - dy * Math.sin(a), y: dx * Math.sin(a) + dy * Math.cos(a) };
}
function hit(p) {
  const playing = !audio.paused, t = audio.currentTime || 0;
  for (let i = state.shapes.length - 1; i >= 0; i--) {
    const o = state.shapes[i];
    if (playing && visAlpha(o, t) < 0.05) continue;   // hidden shapes can't be picked
    const s = playing ? view(o) : o, l = local(s, p), found = o;
    if (s.type === 'path') {
      const P = toLocalPts(s), r = s.lw / 2 + (playing ? 12 : 6);
      for (let j = 1; j < P.length; j++) if (segDist([l.x, l.y], P[j - 1], P[j]) <= r) return found;
      continue;
    }
    if (Math.abs(l.x) <= s.w / 2 && Math.abs(l.y) <= s.h / 2) return found;
  }
  return null;
}
let drag = null;
const marqueeRect = d => [Math.min(d.start.x, d.cur.x), Math.min(d.start.y, d.cur.y), Math.max(d.start.x, d.cur.x), Math.max(d.start.y, d.cur.y)];
cv.addEventListener('pointerdown', ev => {
  const playing = !audio.paused;
  try { window.focus(); cv.focus({ preventScroll: true }); } catch {}   // make sure keystrokes (M, V/P/R/E/T) go to this document, e.g. inside an iframe
  cv.setPointerCapture(ev.pointerId);
  const p = pos(ev);
  state.selEvent = null;
  if (playing) {   // while the track plays you can pick shapes (to mark events with M) but not edit them
    const h = hit(p);
    if (ev.shiftKey && h) state.selIds = state.selIds.includes(h.id) ? state.selIds.filter(x => x !== h.id) : [...state.selIds, h.id];
    else if (h) { if (!state.selIds.includes(h.id)) state.sel = h.id; }
    else { const base = ev.shiftKey ? [...state.selIds] : []; state.selIds = base; drag = { mode: 'marquee', start: p, cur: p, base }; }
    return renderInspector();
  }
  if (state.tool === 'pen') {
    drag = { mode: 'pen', draft: { color: randColor(), lw: 4, pts: [[p.x, p.y]] } };
    return;
  }
  if (state.tool !== 'select') {
    const s = makeShape(state.tool, p.x, p.y, 1, 1);
    state.shapes.push(s); state.sel = s.id;
    drag = { mode: 'create', start: p };
    return renderInspector();
  }
  const cur = sel();
  if (cur) {
    const l = local(cur, p);
    if (Math.abs(l.x - cur.w / 2) < 10 && Math.abs(l.y - cur.h / 2) < 10) { drag = { mode: 'resize' }; return; }
  }
  const h = hit(p);
  if (ev.shiftKey && h) {   // shift-click toggles a shape in the selection
    state.selIds = state.selIds.includes(h.id) ? state.selIds.filter(x => x !== h.id) : [...state.selIds, h.id];
    return renderInspector();
  }
  if (!h) {   // empty space: rubber-band select (shift adds to the current selection)
    const base = ev.shiftKey ? [...state.selIds] : [];
    state.selIds = base;
    drag = { mode: 'marquee', start: p, cur: p, base };
    return renderInspector();
  }
  if (!state.selIds.includes(h.id)) state.sel = h.id;   // grabbing a shape outside the selection selects just it
  drag = { mode: 'move', start: p, orig: selShapes().map(s => [s, s.x, s.y]) };   // moves the whole selection together
  renderInspector();
});
cv.addEventListener('pointermove', ev => {
  if (!drag) return;
  const p = pos(ev);
  if (drag.mode === 'pen') {   // sample only when the cursor moved >= 2px
    const last = drag.draft.pts[drag.draft.pts.length - 1];
    if (Math.hypot(p.x - last[0], p.y - last[1]) >= 2) drag.draft.pts.push([p.x, p.y]);
    return;
  }
  if (drag.mode === 'marquee') {
    drag.cur = p;
    const [x0, y0, x1, y1] = marqueeRect(drag);
    const inside = state.shapes.filter(s => { const b = aabb(audio.paused ? s : view(s)); return b[0] <= x1 && b[2] >= x0 && b[1] <= y1 && b[3] >= y0; }).map(s => s.id);
    state.selIds = [...new Set([...drag.base, ...inside])];
    return;
  }
  if (drag.mode === 'move') {
    for (const [s, ox, oy] of drag.orig) { s.x = ox + p.x - drag.start.x; s.y = oy + p.y - drag.start.y; }
    return;
  }
  const s = sel(); if (!s) return;
  if (drag.mode === 'create') {
    s.x = (p.x + drag.start.x) / 2; s.y = (p.y + drag.start.y) / 2;
    s.w = Math.abs(p.x - drag.start.x); s.h = Math.abs(p.y - drag.start.y);
  } else { const l = local(s, p); s.w = Math.max(8, Math.abs(l.x) * 2); s.h = Math.max(8, Math.abs(l.y) * 2); }
});
addEventListener('pointerup', () => {
  if (drag && drag.mode === 'pen') {
    const s = finishStroke(drag.draft);
    if (s) { state.shapes.push(s); state.sel = s.id; }
  }
  if (drag && drag.mode === 'create') {
    const s = sel();
    if (s && (s.w < 6 || s.h < 6)) { s.w = 120; s.h = 120; }   // plain click => default size
  }
  if (drag) renderInspector();
  drag = null;
});
let toastTimer = null;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
const KEYS = { v: 'select', p: 'pen', r: 'rect', e: 'ellipse', t: 'triangle' };
addEventListener('keydown', ev => {
  const ae = document.activeElement, tag = ae.tagName;
  // only text-entry controls swallow shortcuts (a focused slider/button/colour picker must not)
  const textEntry = tag === 'TEXTAREA' || ae.isContentEditable || (tag === 'INPUT' && !/^(range|color|checkbox|radio|file|button)$/.test(ae.type));
  const typing = textEntry || tag === 'SELECT';   // dropdowns also keep letter keys for their own type-ahead
  if (!typing && !ev.ctrlKey && !ev.metaKey) {
    if (ev.key === 'Escape') setTool('select');
    else if (KEYS[ev.key.toLowerCase()]) setTool(KEYS[ev.key.toLowerCase()]);
  }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'a' && !typing) {
    ev.preventDefault(); setTool('select'); state.selIds = state.shapes.map(s => s.id); state.selEvent = null; renderInspector();
  }
  if (ev.key.toLowerCase() === 'm' && !textEntry && !ev.ctrlKey && !ev.metaKey) {   // mark an event at the playhead
    ev.preventDefault(); if (!ev.repeat) addEvent();
  }
  if ((ev.key === 'Delete' || ev.key === 'Backspace') && !typing) {
    if (state.selEvent) { state.events = state.events.filter(e => e.id !== state.selEvent); state.selEvent = null; renderInspector(); }
    else if (state.selIds.length) { [...state.selIds].forEach(deleteShape); renderInspector(); }   // deletes the whole selection
  }
}, true);   // capture phase: nothing else on the page can swallow these keys

// ---------- toolbar ----------
function setTool(t) {
  state.tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  initAudio();
  audio.src = URL.createObjectURL(f);
  $('fname').textContent = f.name; hasAudio = true;
  audio.onloadedmetadata = () => { updateTime(); renderInspector(); };
};
$('play').onclick = async () => {
  if (!hasAudio) return alert('Upload an audio file first.');
  initAudio(); await actx.resume();
  audio.paused ? audio.play() : audio.pause();
};
audio.onplay = () => $('play').textContent = 'Pause';
audio.onpause = () => $('play').textContent = 'Play';
audio.onended = () => $('play').textContent = 'Play';
$('seek').oninput = () => { if (audio.duration) audio.currentTime = $('seek').value / 1000 * audio.duration; };
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function updateTime() {
  const d = audio.duration || 0;
  $('time').textContent = `${fmt(audio.currentTime)} / ${fmt(d)}`;
  if (d && document.activeElement !== $('seek')) $('seek').value = audio.currentTime / d * 1000;
}

$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ shapes: state.shapes, nextId: state.nextId, events: state.events, nextEv: state.nextEv }, null, 2)], { type: 'application/json' }));
  a.download = 'design.json'; a.click();
};
$('load').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    state.shapes = d.shapes; state.nextId = d.nextId || state.shapes.length + 1; state.sel = null;
    state.events = (d.events || []).map(e => e.shapeIds ? e : { ...e, shapeIds: [e.shapeId] }); state.nextEv = d.nextEv || state.events.length + 1; state.selEvent = null;
    renderInspector();
  } catch { alert('Could not read that file.'); }
};

// ---------- timeline event markers ----------
const MK_PAD = 6;   // half the seek thumb width, so lines line up with the thumb
function mkLeft(t, d) { return `calc(${MK_PAD}px + (100% - ${MK_PAD * 2}px) * ${t / d})`; }
function renderMarkers() {
  const el = $('markers'), d = audio.duration;
  if (!d) { el.innerHTML = ''; return; }
  el.innerHTML = state.events.map(e => {
    const ss = e.shapeIds.map(id => state.shapes.find(x => x.id === id)).filter(Boolean); if (!ss.length) return '';
    const c = ss.length === 1 ? ss[0].fill : `linear-gradient(${ss.map(x => x.fill).join(',')})`;   // gradient of the shapes' colors
    const what = ss.length === 1 ? ss[0].type : ss.length + ' shapes';
    return `<div class="mk${e.id === state.selEvent ? ' sel' : ''}${e.shapeIds.some(id => state.selIds.includes(id)) ? ' mine' : ''}" data-id="${e.id}" ` +
      `style="--c:${c};left:${mkLeft(Math.min(e.time, d), d)}" title="${what} · ${e.action} · ${e.time.toFixed(1)}s"></div>`;
  }).join('');
}
let mkDrag = null;
$('markers').addEventListener('pointerdown', ev => {
  const m = ev.target.closest('.mk'); if (!m) return;
  const e = state.events.find(x => x.id === +m.dataset.id); if (!e) return;
  m.setPointerCapture(ev.pointerId);
  mkDrag = { e, m };
  state.selEvent = e.id; if (!e.shapeIds.some(id => state.selIds.includes(id))) state.sel = e.shapeIds[0];
  document.querySelectorAll('.mk').forEach(x => {
    const o = state.events.find(y => y.id === +x.dataset.id);
    x.classList.toggle('sel', o === e); x.classList.toggle('mine', !!o && o.shapeIds.some(id => state.selIds.includes(id)));
  });
  renderInspector(true);   // keep marker elements alive so the drag keeps its pointer capture
});
$('markers').addEventListener('pointermove', ev => {
  if (!mkDrag || !audio.duration) return;
  const r = $('timeline').getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (ev.clientX - r.left - MK_PAD) / (r.width - MK_PAD * 2)));
  mkDrag.e.time = +(f * audio.duration).toFixed(2);
  mkDrag.m.style.left = mkLeft(mkDrag.e.time, audio.duration);
  const inp = document.querySelector(`.evrow[data-ev="${mkDrag.e.id}"] [data-k=time]`);
  if (inp) inp.value = mkDrag.e.time.toFixed(2);
});
$('markers').addEventListener('pointerup', () => { if (mkDrag) { mkDrag = null; renderInspector(); } });

// ---------- inspector ----------
function renderInspector(skipMarkers) {
  if (!skipMarkers) renderMarkers();
  const el = $('inspector'), s = sel();
  if (!s && state.selIds.length > 1) {   // several shapes selected: group actions
    const n = state.selIds.length;
    el.innerHTML = `
      <h3>${n} shapes selected</h3>
      <div class="row"><button id="m-dup">Duplicate</button><button id="m-del">Delete</button></div>
      <h3>Events (over time)</h3>
      <button id="i-addev" ${audio.duration ? '' : 'disabled title="Upload audio first"'}>+ Event for all ${n} at playhead (M)</button>
      <p class="dim">Drag any selected shape to move them together; Delete removes them all. Shift-click or shift-drag adds or removes shapes. Select a single shape to edit it.</p>`;
    $('i-addev').onclick = addEvent;
    $('m-del').onclick = () => { [...state.selIds].forEach(deleteShape); renderInspector(); };
    $('m-dup').onclick = () => {
      const copies = selShapes().map(o => { const c = JSON.parse(JSON.stringify(o)); c.id = state.nextId++; c.x += 20; c.y += 20; return c; });
      state.shapes.push(...copies); state.selIds = copies.map(c => c.id); renderInspector();
    };
    return;
  }
  if (!s) { el.innerHTML = '<p class="dim">Click and drag on the canvas to draw freehand with the pen. Switch tools with the toolbar or V / P / R / E / T (Esc = Select). With Select, click a shape to edit it, or drag a box (shift to add) to select several and move or delete them together.</p>'; return; }
  const evs = s ? state.events.filter(e => e.shapeIds.includes(s.id) || e.id === state.selEvent).sort((a, b) => a.time - b.time) : [];
  const GLYPH = { path: '✎', rect: '▭', ellipse: '◯', triangle: '△' };
  const opt = (obj, cur) => (Array.isArray(obj) ? obj.map(k => [k, k]) : Object.entries(obj))
    .map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');
  el.innerHTML = `
    <h3>Shape (${s.type}${s.pts ? ', ' + s.pts.length + ' pts' : ''})</h3>
    <div class="row"><span>${s.pts ? 'Color' : 'Fill'}</span><input type="color" id="i-fill" value="${s.fill}"></div>
    ${s.pts ? `<div class="row"><span>Line</span><input type="number" id="i-lw" min="1" max="60" value="${s.lw}"></div>` : ''}
    <div class="row"><span>Width</span><input type="number" id="i-w" value="${Math.round(s.w)}"></div>
    <div class="row"><span>Height</span><input type="number" id="i-h" value="${Math.round(s.h)}"></div>
    <div class="row"><span>Rotation</span><input type="number" id="i-rot" value="${Math.round(s.rot)}"></div>
    <div class="row"><span>Opacity</span><input type="range" id="i-op" min="0" max="1" step="0.01" value="${s.opacity}"></div>
    <div class="row"><button id="i-up">Forward</button><button id="i-down">Back</button><button id="i-dup">Duplicate</button><button id="i-del">Delete</button></div>
    <h3>Audio reactive (moment to moment)</h3>
    ${s.bindings.map((b, i) => `
      <div class="bind" data-i="${i}">
        <select data-k="band">${opt(BANDS, b.band)}</select>
        <select data-k="prop">${opt(PROPS, b.prop)}</select>
        <input type="range" data-k="amount" min="-2" max="2" step="0.05" value="${b.amount}">
        <button data-rm="${i}" title="Remove">×</button>
      </div>`).join('')}
    <button id="i-addb">+ Add binding</button>
    <h3>Events (over time)</h3>
    ${evs.map(e => `
      <div class="evrow ${e.id === state.selEvent ? 'sel' : ''}" data-ev="${e.id}">
        <input type="number" step="0.1" min="0" data-k="time" value="${e.time.toFixed(2)}"><span class="dim">s</span>
        <select data-k="action">${opt(EVENT_ACTIONS, e.action)}</select>
        <button data-rmev="${e.id}" title="Remove">×</button>
        <div class="chips" title="Shapes this event affects">${state.shapes.map(x =>
          `<button class="chip ${e.shapeIds.includes(x.id) ? 'inc' : ''}" data-chip="${x.id}" style="--c:${x.fill}" title="${x.type} #${x.id}">${GLYPH[x.type] || '?'}</button>`).join('')}
          <button class="chip all" data-chip="all" title="All shapes">all</button></div>
      </div>`).join('')}
    <button id="i-addev" ${audio.duration ? '' : 'disabled title="Upload audio first"'}>+ Event at playhead (M)</button>
    <p class="dim">Events show/hide shapes at moments in the song, drawn as lines on the timeline. Press M while playing to mark one for this shape: it shows the shape, then the next one hides it, and so on (change with the dropdown). Tap other shapes' chips on an event to include them. A shape whose first event is Show starts hidden.</p>`;
  const bind = (id, fn) => $(id).oninput = e => fn(e.target);
  bind('i-fill', t => s.fill = t.value);
  if (s.pts) bind('i-lw', t => s.lw = Math.max(1, +t.value));
  bind('i-w', t => s.w = Math.max(1, +t.value));
  bind('i-h', t => s.h = Math.max(1, +t.value));
  bind('i-rot', t => s.rot = +t.value);
  bind('i-op', t => s.opacity = +t.value);
  const reorder = d => { const i = state.shapes.indexOf(s), j = i + d; if (j >= 0 && j < state.shapes.length) { state.shapes.splice(i, 1); state.shapes.splice(j, 0, s); } };
  $('i-up').onclick = () => reorder(1);
  $('i-down').onclick = () => reorder(-1);
  $('i-dup').onclick = () => { const c = JSON.parse(JSON.stringify(s)); c.id = state.nextId++; c.x += 20; c.y += 20; state.shapes.push(c); state.sel = c.id; renderInspector(); };
  $('i-del').onclick = () => { deleteShape(s.id); renderInspector(); };
  $('i-addev').onclick = addEvent;
  el.querySelectorAll('.evrow').forEach(row => {
    const e = state.events.find(x => x.id === +row.dataset.ev);
    row.querySelector('[data-k=time]').oninput = ev => { e.time = Math.max(0, +ev.target.value || 0); renderMarkers(); };
    row.querySelector('[data-k=action]').oninput = ev => { e.action = ev.target.value; renderMarkers(); };
    row.querySelectorAll('[data-chip]').forEach(ch => ch.onclick = () => {
      const id = ch.dataset.chip;
      if (id === 'all') e.shapeIds = state.shapes.map(x => x.id);
      else if (e.shapeIds.includes(+id)) { if (e.shapeIds.length > 1) e.shapeIds = e.shapeIds.filter(x => x !== +id); }   // keep at least one
      else e.shapeIds.push(+id);
      state.selEvent = e.id; renderInspector();
    });
    row.querySelector('[data-rmev]').onclick = () => { state.events = state.events.filter(x => x !== e); state.selEvent = null; renderInspector(); };
    row.onclick = ev => { if (ev.target === row || ev.target.tagName === 'SPAN') { state.selEvent = e.id; renderInspector(); } };
  });
  $('i-addb').onclick = () => { s.bindings.push({ band: 'bass', prop: 'scale', amount: 0.5 }); renderInspector(); };
  el.querySelectorAll('.bind').forEach(div => {
    const b = s.bindings[+div.dataset.i];
    div.querySelectorAll('[data-k]').forEach(inp => inp.oninput = () => b[inp.dataset.k] = inp.dataset.k === 'amount' ? +inp.value : inp.value);
    div.querySelector('[data-rm]').onclick = () => { s.bindings.splice(+div.dataset.i, 1); renderInspector(); };
  });
}

// ---------- main loop ----------
const meters = [...document.querySelectorAll('#meters div')];
function frame() {
  updateBands(); draw(); updateTime();
  BANDS.forEach((k, i) => meters[i].style.height = Math.max(2, bands[k] * 26) + 'px');
  requestAnimationFrame(frame);
}

renderInspector();
frame();
</script>
</body>
</html>
