<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Shapes</title>
<style>
  :root { --bg:#14151a; --panel:#1d1f27; --line:#2d303b; --text:#e6e8ee; --dim:#8b90a0; --accent:#6c8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px system-ui,sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
  header, footer { background:var(--panel); border-color:var(--line); display:flex; gap:8px; align-items:center; padding:8px 12px; flex-wrap:wrap; }
  header { border-bottom:1px solid var(--line); }
  footer { border-top:1px solid var(--line); }
  main { display:grid; grid-template-columns:1fr 280px; min-height:0; }
  #left { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .tabs { display:flex; } .tabs button { border-radius:0; } .tabs button:first-child { border-radius:5px 0 0 5px; } .tabs button:last-child { border-radius:0 5px 5px 0; margin-left:-1px; }
  body.mode-workshop .stage-only, body.mode-stage .workshop-only { display:none !important; }
  body.mode-workshop canvas { background:#171922; background-image:radial-gradient(#2c3040 1px, transparent 1px); background-size:24px 24px; }
  body.mode-stage canvas { background:#0b0b0f; }
  #modelabel { position:absolute; left:26px; top:24px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); pointer-events:none; }
  #tray { display:flex; gap:8px; padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); overflow-x:auto; align-items:stretch; min-height:92px; }
  #tray .empty { color:var(--dim); align-self:center; }
  .thumb { flex:0 0 auto; width:76px; border:1px solid var(--line); border-radius:6px; padding:4px; background:#14161d; cursor:grab; text-align:center; user-select:none; }
  .thumb:hover { border-color:var(--accent); }
  .thumb canvas { width:60px; height:60px; background:none !important; border:0; aspect-ratio:auto; max-width:none; max-height:none; display:block; margin:0 auto; }
  .thumb span { display:block; font-size:10px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #exportbar { position:absolute; left:50%; top:14px; transform:translateX(-50%); display:none; align-items:center; gap:10px; background:#2b1a1a; border:1px solid #ff6c6c; border-radius:6px; padding:6px 12px; z-index:7; white-space:nowrap; }
  body.exporting #exportbar { display:flex; }
  #exportbar .bar { width:160px; height:6px; background:#442; border-radius:3px; overflow:hidden; } #exportbar .bar i { display:block; height:100%; width:0; background:#ff6c6c; }
  body.exporting header, body.exporting aside, body.exporting #tray, body.exporting footer, body.exporting canvas { pointer-events:none; opacity:.6; }
  body.exporting #stage { pointer-events:auto; }
  #banner { position:absolute; left:50%; top:60px; transform:translateX(-50%); white-space:nowrap; background:#2a2140; border:1px solid #9b7bff; color:#e6e8ee; padding:6px 14px; border-radius:6px; z-index:4; display:none; }
  #banner.show { display:block; }
  .xfbar { position:absolute; top:12px; height:8px; border-radius:4px; opacity:.5; pointer-events:none; background:linear-gradient(to right, var(--a), var(--b)); }
  .mk.xf::before { top:2px; left:1px; width:9px; height:9px; transform:rotate(45deg); border-radius:1px; }
  .mk.xf::after { top:8px; }
  .xfrow { border:1px solid var(--line); border-radius:6px; padding:6px; margin-bottom:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .xfrow.sel { border-color:#9b7bff; }
  .xfrow input[type=number] { width:62px; }
  .xfrow select { flex:1; min-width:70px; }
  #toast { position:absolute; left:50%; top:22px; transform:translateX(-50%); white-space:nowrap; background:#272a35; border:1px solid var(--accent); color:var(--text); padding:7px 14px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .15s; z-index:5; }
  #toast.show { opacity:1; }
  canvas:focus { outline:none; }
  #stage { position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:16px; min-width:0; min-height:0; }
  canvas { background:#0b0b0f; max-width:100%; max-height:100%; aspect-ratio:16/9; border:1px solid var(--line); touch-action:none; }
  aside { background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto; }
  button, select, input { font:inherit; color:var(--text); background:#272a35; border:1px solid var(--line); border-radius:5px; padding:5px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  input[type=range] { padding:0; }
  input[type=color] { padding:0; width:32px; height:26px; }
  input[type=number] { width:70px; }
  label.file { cursor:pointer; background:var(--accent); padding:5px 10px; border-radius:5px; color:#fff; }
  .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  h3 { margin:14px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .row > span { width:56px; color:var(--dim); }
  .transport { display:flex; gap:4px; align-items:center; }
  .transport button { padding:5px 8px; min-width:34px; }
  #tip { position:absolute; top:-26px; transform:translateX(-50%); background:#272a35; border:1px solid var(--line); border-radius:4px; padding:1px 6px; font-size:11px; pointer-events:none; opacity:0; white-space:nowrap; z-index:6; }
  #tip.show { opacity:1; }
  #stage:fullscreen { background:#000; padding:0; }
  #stage:fullscreen canvas { border:0; }
  #stage:fullscreen #modelabel { display:none; }
  #timeline { flex:1; min-width:160px; height:30px; position:relative; }
  #seek { -webkit-appearance:none; appearance:none; background:transparent; width:100%; height:8px; margin:0; padding:0; position:absolute; left:0; top:11px; }
  #seek::-webkit-slider-runnable-track { height:4px; background:#2d303b; border-radius:2px; }
  #seek::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--accent); margin-top:-4px; }
  #seek::-moz-range-track { height:4px; background:#2d303b; border-radius:2px; }
  #seek::-moz-range-thumb { width:12px; height:12px; border:0; border-radius:50%; background:var(--accent); }
  #markers { position:absolute; inset:0; pointer-events:none; }
  .mk { position:absolute; top:0; bottom:0; width:11px; margin-left:-5px; cursor:ew-resize; pointer-events:auto; touch-action:none; }
  .mk::after { content:''; position:absolute; left:4px; top:0; bottom:0; width:2px; background:var(--c); opacity:.75; border-radius:1px; }
  .mk::before { content:''; position:absolute; left:1px; top:0; width:9px; height:6px; background:var(--c); opacity:.75; border-radius:2px; }
  .mk.flash::after { animation:mkflash .7s ease-out; }
  @keyframes mkflash { 0% { box-shadow:0 0 0 0 #fff, 0 0 14px 4px #fff; transform:scaleX(4); } 100% { box-shadow:0 0 0 0 transparent; transform:scaleX(1); } }
  .mk.mine::after, .mk.mine::before { opacity:1; }
  .mk.sel::after { background:#fff; width:3px; left:4px; opacity:1; }
  .mk.sel::before { background:#fff; opacity:1; }
  .evrow { border:1px solid var(--line); border-radius:6px; padding:6px; margin-bottom:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .chips { flex-basis:100%; display:flex; flex-wrap:wrap; gap:4px; }
  .chip { width:24px; height:22px; padding:0; font-size:12px; line-height:1; background:var(--c); color:#000; border:2px solid transparent; opacity:.35; text-shadow:0 0 2px #fff; }
  .chip.inc { opacity:1; border-color:#fff; }
  .chip.all { width:auto; padding:0 6px; background:#272a35; color:var(--dim); opacity:1; border:1px solid var(--line); text-shadow:none; }
  .evrow.sel { border-color:#fff; }
  .evrow input[type=number] { width:70px; }
  .evrow select { flex:1; }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<header>
  <div class="tabs" role="tablist">
    <button data-mode="workshop" class="on" title="Create and edit your shapes (1)">Workshop</button>
    <button data-mode="stage" title="Arrange shapes, mark events and play (2)">Stage</button>
  </div>
  <div class="sep"></div>
  <button data-tool="select" title="Select / move (V)">Select</button>
  <button data-tool="pen" class="workshop-only on" title="Pen: click and drag to draw (P)">Pen</button>
  <button data-tool="rect" class="workshop-only" title="Rectangle (R)">Rectangle</button>
  <button data-tool="ellipse" class="workshop-only" title="Ellipse (E)">Ellipse</button>
  <button data-tool="triangle" class="workshop-only" title="Triangle (T)">Triangle</button>
  <button data-tool="transform" class="stage-only" title="Transform: turn one shape into another over time (X)">Transform</button>
  <div class="sep stage-only"></div>
  <label class="file stage-only">Upload audio<input id="file" type="file" accept="audio/*" hidden></label>
  <span id="fname" class="dim stage-only">no file</span>
  <div class="sep"></div>
  <button id="export" class="stage-only" title="Export what plays on the stage (picture and sound) as a video file. It records in real time, so it takes as long as the track.">Export video</button>
  <select id="expq" class="stage-only" title="Quality" aria-label="Export quality"><option value="compressed" selected>Compressed</option><option value="high">High quality</option></select>
  <select id="expfmt" class="stage-only" title="File type" aria-label="Export file type"><option value="webm" selected>WebM</option><option value="mp4" title="H.264 video with Opus audio: some players (QuickTime) can't play Opus audio">MP4</option></select>
  <div class="sep stage-only"></div>
  <button id="save">Save JSON</button>
  <label class="file" style="background:#272a35">Load JSON<input id="load" type="file" accept="application/json" hidden></label>
  <button id="newproj" title="Start over (clears the library and the stage)">New</button>
</header>
<main>
  <div id="left">
    <div id="stage"><canvas id="cv" width="960" height="540" tabindex="0"></canvas><div id="modelabel"></div><div id="exportbar"><span id="exptext">Exporting…</span><span class="bar"><i id="expfill"></i></span><button id="expcancel">Cancel (Esc)</button></div><div id="banner"></div><div id="toast" role="status"></div></div>
    <div id="tray" class="stage-only"></div>
  </div>
  <aside id="inspector"></aside>
</main>
<footer class="stage-only">
  <div class="transport">
    <button id="toStart" title="Back to the start (Home)">|&#9664;</button>
    <button id="back10" title="Back 10 seconds (J)">&#9664;&#9664; 10</button>
    <button id="play" class="primary" title="Play / pause (Space or K)" style="width:70px">Play</button>
    <button id="fwd10" title="Forward 10 seconds (L)">10 &#9654;&#9654;</button>
  </div>
  <span id="time" class="dim" title="Current time / length">0:00 / 0:00</span>
  <div id="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><div id="markers"></div><div id="tip"></div></div>
  <div class="transport">
    <button id="loop" title="Loop the track">Loop</button>
    <select id="speed" title="Playback speed" aria-label="Playback speed">
      <option value="0.5">0.5&times;</option><option value="0.75">0.75&times;</option><option value="1" selected>1&times;</option>
      <option value="1.25">1.25&times;</option><option value="1.5">1.5&times;</option><option value="2">2&times;</option>
    </select>
    <button id="mute" title="Mute / unmute">&#128266;</button>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" style="width:80px">
    <button id="fs" title="Present full screen (F)">Full screen</button>
  </div>
</footer>

<script>
'use strict';
const W = 960, H = 540;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);


const state = {
  // The Workshop holds the library of shape definitions (`symbols`); the Stage holds placed copies (`stage` instances) that point at a symbol.
  // `shapes` is whichever list belongs to the active space, so selection / drawing / hit-testing code works in both.
  symbols: [], stage: [], mode: 'workshop', deleteArmed: null,
  get shapes() { return this.mode === 'stage' ? this.stage : this.symbols; },
  set shapes(v) { if (this.mode === 'stage') this.stage = v; else this.symbols = v; },
  selIds: [],
  // `sel` is the id when exactly one shape is selected (inspector edits it); assigning it selects just that shape
  get sel() { return this.selIds.length === 1 ? this.selIds[0] : null; },
  set sel(v) { this.selIds = v == null ? [] : [v]; },
  tool: 'pen', nextId: 1, events: [], selEvent: null, nextEv: 1,
  transforms: [], nextXf: 1, selXf: null, pendingXf: null };   // a transform: shape `from` morphs into shape `to` between `start` and `end`
const EVENT_ACTIONS = { toggle: 'Toggle visible', show: 'Show', hide: 'Hide' };
const FADE = 0.15;   // seconds
// An event targets one or more shapes (shapeIds). Visibility over time, derived only from events (so scrubbing is deterministic).
// Starts visible unless the shape's first event is Show. Returns 0..1 (fades over FADE after a change).
function visAlpha(s, t) {
  const evs = state.events.filter(e => e.shapeIds.includes(s.id)).sort((a, b) => a.time - b.time);
  let vis = !(evs.length && evs[0].action === 'show'), since = -Infinity;
  for (const e of evs) {
    if (e.time > t) break;
    const next = e.action === 'toggle' ? !vis : e.action === 'show';
    if (next !== vis) { vis = next; since = e.time; }
  }
  const k = Math.min(1, (t - since) / FADE);
  return vis ? k : 1 - k;
}
// ---------- transformations (shape A morphs into shape B over time) ----------
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = k => k * k * (3 - 2 * k);
const completeXfs = () => state.transforms.filter(x => x.to != null && x.end != null && x.end > x.start);
// For shape s at time t: `mult` 0 when it is not part of the scene (a destination before its morph finishes, or a source after it),
// and `morph` while s is turning into its target. The destination appears at the moment the morph completes (seamless: same form).
function xfFactor(s, t) {
  let mult = 1, morph = null;
  for (const x of completeXfs()) {
    if (x.to === s.id && t < x.end) mult = 0;
    if (x.from === s.id) { if (t >= x.end) mult = 0; else if (t >= x.start) morph = { x, k: smooth((t - x.start) / (x.end - x.start)) }; }
  }
  return { mult, morph };
}
const XF_N = 200;
function polyArea(P) { let a = 0; for (let i = 0; i < P.length; i++) { const q = P[(i + 1) % P.length]; a += P[i][0] * q[1] - q[0] * P[i][1]; } return a / 2; }
function resample(P, n) {   // P is a closed polygon (implicitly joined last->first); n points evenly spaced by arc length
  const Q = [...P, P[0]], cum = [0];
  for (let i = 1; i < Q.length; i++) cum.push(cum[i - 1] + Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]));
  const total = cum.at(-1) || 1, out = [];
  for (let i = 0, j = 1; i < n; i++) {
    const d = i / n * total;
    while (j < Q.length - 1 && cum[j] < d) j++;
    const seg = cum[j] - cum[j - 1] || 1, f = (d - cum[j - 1]) / seg;
    out.push([lerp(Q[j - 1][0], Q[j][0], f), lerp(Q[j - 1][1], Q[j][1], f)]);
  }
  return out;
}
// n points on the boundary of a polygon that is star-shaped about the origin, one per ray starting at the top and going clockwise.
// Matching shapes ray-by-ray makes in-betweens of convex shapes smooth and convex (arc-length matching pinches the sides).
function radialSample(P, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i / n * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let best = 0;
    for (let j = 0; j < P.length; j++) {
      const A = P[j], B = P[(j + 1) % P.length], ex = B[0] - A[0], ey = B[1] - A[1], den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const r = (A[0] * ey - A[1] * ex) / den, u = (A[0] * dy - A[1] * dx) / den;
      if (r > best && u >= -1e-9 && u <= 1 + 1e-9) best = r;
    }
    out.push([dx * best, dy * best]);
  }
  return out;
}
// A shape as a closed, clockwise polygon of XF_N points around its centre, starting at its top: points correspond between any two shapes.
function outline(s) {
  const w = s.w / 2, h = s.h / 2;
  let P, verts = null, spin = true;
  if (s.type === 'rect') P = verts = [[-w, -h], [w, -h], [w, h], [-w, h]];
  else if (s.type === 'triangle') P = verts = [[0, -h], [w, h], [-w, h]];
  else if (s.type === 'ellipse') { P = []; for (let i = 0; i < 128; i++) { const a = -Math.PI / 2 + i / 128 * Math.PI * 2; P.push([Math.cos(a) * w, Math.sin(a) * h]); } }
  else {   // freehand: a (roughly) closed loop is used as a polygon; an open stroke goes out and back so it looks the same and has no closing line
    const L = toLocalPts(s), gap = Math.hypot(L[0][0] - L.at(-1)[0], L[0][1] - L.at(-1)[1]);
    if (gap <= Math.max(20, 0.15 * Math.max(s.w, s.h))) P = L; else { P = [...L, ...L.slice(1, -1).reverse()]; spin = false; }
  }
  if (spin && polyArea(P) < 0) P = [...P].reverse();
  let R = s.type === 'path' ? resample(P, XF_N) : radialSample(P, XF_N);
  if (verts) for (const v of verts) {   // snap to the true corners so rectangles/triangles stay sharp
    let bi = 0, bd = Infinity; R.forEach((q, i) => { const d = Math.hypot(q[0] - v[0], q[1] - v[1]); if (d < bd) { bd = d; bi = i; } });
    R[bi] = [v[0], v[1]];
  }
  if (spin && s.type === 'path') {   // freehand loops: start at the top-centre so shapes line up with each other
    let bi = 0, bv = Infinity; R.forEach((q, i) => { const v = q[1] + 0.001 * Math.abs(q[0]); if (v < bv) { bv = v; bi = i; } });
    R = [...R.slice(bi), ...R.slice(0, bi)];
  }
  return R;
}
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixColor = (a, b, k) => { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const angDiff = (a, b) => ((b - a + 540) % 360) - 180;
function drawMorph(A, B, k, t, ghost) {
  const pa = outline(A), pb = outline(B), pt = pa.map((q, i) => [lerp(q[0], pb[i][0], k), lerp(q[1], pb[i][1], k)]);
  const va = visAlpha(A, t), alpha = lerp(A.opacity, B.opacity, k) * (va + (1 - va) * ghost);   // only the source's own events matter mid-morph; the destination takes over when it ends
  const fillK = lerp(A.type === 'path' ? 0 : 1, B.type === 'path' ? 0 : 1, k), strokeK = lerp(A.type === 'path' ? 1 : 0, B.type === 'path' ? 1 : 0, k);
  const lw = lerp(A.type === 'path' ? A.lw : 0, B.type === 'path' ? B.lw : 0, k);
  ctx.save();
  ctx.translate(lerp(A.x, B.x, k), lerp(A.y, B.y, k)); ctx.rotate((A.rot + angDiff(A.rot, B.rot) * k) * Math.PI / 180);
  ctx.beginPath(); pt.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.closePath();
  const col = mixColor(A.fill, B.fill, k);
  if (fillK > 0.01) { ctx.globalAlpha = alpha * fillK; ctx.fillStyle = col; ctx.fill(); }
  if (strokeK > 0.01 && lw > 0.2) { ctx.globalAlpha = alpha * strokeK; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineJoin = ctx.lineCap = 'round'; ctx.stroke(); }
  ctx.restore();
}
function pendingXf() { return state.transforms.find(x => x.id === state.pendingXf); }
function cancelPendingXf() { state.transforms = state.transforms.filter(x => x.id !== state.pendingXf); state.pendingXf = null; updateBanner(); renderInspector(); }
function updateBanner() {
  const b = $('banner'), x = pendingXf();
  const msg = state.tool !== 'transform' ? '' : !x ? 'Transform: click the shape that should start changing (at the playhead)'
    : x.to == null ? 'Now click the shape it should turn into  ·  Esc cancels' : 'Click anywhere to stop the transformation here  ·  Esc cancels';
  b.textContent = msg; b.classList.toggle('show', !!msg);
}
// Transform tool: 1) click shape A = start at the playhead, 2) click the shape it becomes, 3) click anywhere = stop at the playhead
function transformClick(p) {
  if (!audio.duration) return toast('Upload audio first');
  const h = hit(p, true), t = +audio.currentTime.toFixed(2), x = pendingXf();
  if (!x) {
    if (!h) return toast('Click the shape that should start changing');
    const nx = { id: state.nextXf++, from: h.id, to: null, start: t, end: null };
    state.transforms.push(nx); state.pendingXf = nx.id; state.selXf = nx.id; state.sel = h.id;
    state.flash = { ids: [h.id], action: 'start', t0: performance.now() };
  } else if (x.to == null) {
    if (!h || h.id === x.from) return toast('Click a different shape: the one it should turn into');
    x.to = h.id; state.flash = { ids: [h.id], action: 'target', t0: performance.now() };
  } else {
    x.end = Math.max(t, +(x.start + 0.3).toFixed(2)); state.pendingXf = null; state.selXf = x.id;
    state.flash = { ids: [x.from, x.to], action: 'stop', t0: performance.now() };
    toast(`Transformation ${x.start.toFixed(1)}s to ${x.end.toFixed(1)}s`);
  }
  updateBanner(); renderInspector();
}
function removeFromStage(id) {   // a placed shape: also drop its events and transformations
  state.transforms = state.transforms.filter(x => x.from !== id && x.to !== id);
  if (state.pendingXf && !pendingXf()) { state.pendingXf = null; updateBanner(); }
  state.stage = state.stage.filter(s => s.id !== id);

// ---------- export: record the stage (picture + sound) to a video file ----------
// Real time: the track plays from the start while the canvas and the audio are recorded. WebM (VP9 + Opus) is the default;

const EXPORT_Q = { compressed: [2.5e6, 128e3], high: [8e6, 192e3] };
const EXPORT_TYPES = { webm: ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'], mp4: ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4'] };

async function exportVideo() {

  const [vbr, abr] = EXPORT_Q[$('expq').value];
  const prev = { t: audio.currentTime, rate: audio.playbackRate, loop: audio.loop, muted: audio.muted, vol: audio.volume };
  if (state.pendingXf) cancelPendingXf();
  audio.pause(); audio.currentTime = 0; audio.playbackRate = 1; audio.loop = false; audio.volume = 1; audio.muted = true;   // silent while recording; the captured sound is unaffected
  state.exporting = true; state.selIds = []; state.selEvent = state.selXf = null; state.flash = state.ripple = null;
  document.body.classList.add('exporting'); renderInspector();
  let tick, rec, video, cancelled = false;

    video = cv.captureStream(30);

    rec = new MediaRecorder(new MediaStream([...video.getVideoTracks(), ...audio.captureStream().getAudioTracks()]), { mimeType: type, videoBitsPerSecond: vbr, audioBitsPerSecond: abr });
    const chunks = [], stopped = new Promise(r => { rec.onstop = r; });

    rec.start(250);

    cancelled = await finished;

// ---------- project: save / load / autosave ----------
// version 2: a library of shapes (`symbols`) + the presentation (`stage` placements, events, transformations).
// Older single-canvas files load too: every old shape becomes a library shape plus one placement on the stage.
function projectData() {

};

// The whole project (library + stage) is kept in this browser and restored on reload. Normally that is localStorage; when the app
// runs inside a sandboxed iframe (no storage access, e.g. embedded in a web page) it asks the host page to keep it via postMessage.
const LS_KEY = 'music-shapes:project:v2';

let lsOk = true; try { localStorage.getItem(LS_KEY); } catch { lsOk = false; }
const hosted = window.parent !== window;
const toHost = msg => { try { window.parent.postMessage({ app: 'music-shapes', ...msg }, '*'); } catch {} };

  if (state.symbols.length || state.stage.length) return;   // already working on something: don't overwrite it

// ---------- timeline event markers ----------
const MK_PAD = 6;   // half the seek thumb width, so lines line up with the thumb
function mkLeft(t, d) { return `calc(${MK_PAD}px + (100% - ${MK_PAD * 2}px) * ${t / d})`; }
function renderMarkers() {
  const el = $('markers'), d = audio.duration;
  if (!d) { el.innerHTML = ''; return; }
  el.innerHTML = state.events.map(e => {
    const ss = e.shapeIds.map(id => state.shapes.find(x => x.id === id)).filter(Boolean); if (!ss.length) return '';
    const c = ss.length === 1 ? ss[0].fill : `linear-gradient(${ss.map(x => x.fill).join(',')})`;   // gradient of the shapes' colors
    const what = ss.length === 1 ? ss[0].type : ss.length + ' shapes';
    return `<div class="mk${e.id === state.selEvent ? ' sel' : ''}${e.shapeIds.some(id => state.selIds.includes(id)) ? ' mine' : ''}" data-id="${e.id}" ` +
      `style="--c:${c};left:${mkLeft(Math.min(e.time, d), d)}" title="${what} · ${e.action} · ${e.time.toFixed(1)}s"></div>`;
  }).join('') + state.transforms.map(x => {
    const A = state.shapes.find(q => q.id === x.from), B = state.shapes.find(q => q.id === x.to); if (!A) return '';
    const sel = x.id === state.selXf ? ' sel' : '', mine = state.selIds.includes(x.from) || state.selIds.includes(x.to) ? ' mine' : '';
    const handle = (edge, time, col, label) => `<div class="mk xf${sel}${mine}" data-xf="${x.id}" data-edge="${edge}" style="--c:${col};left:${mkLeft(Math.min(time, d), d)}" title="${label} ${time.toFixed(1)}s"></div>`;

    <div class="row"><span>Width</span><input type="number" id="i-w" value="${Math.round(s.w)}"></div>
    <div class="row"><span>Height</span><input type="number" id="i-h" value="${Math.round(s.h)}"></div>
    <div class="row"><button id="w-add" class="primary">Add to stage</button><button id="i-dup">Duplicate</button><button id="i-del">${delLabel}</button></div>
    <p class="dim">${used ? `Placed ${used}&times; on the stage. Changes here update every placement.` : 'Not on the stage yet. Add it here, or from the Stage tab.'}</p>`;
  $('w-name').oninput = e => { s.name = e.target.value.slice(0, 40); };
  $('i-fill').oninput = e => { s.fill = e.target.value; };
  if (s.pts) $('i-lw').oninput = e => { s.lw = Math.max(1, +e.target.value); };
  $('i-w').oninput = e => { const w = Math.max(1, +e.target.value); usesOf(s.id).forEach(i => i.w *= w / s.w); s.w = w; };
  $('i-h').oninput = e => { const h = Math.max(1, +e.target.value); usesOf(s.id).forEach(i => i.h *= h / s.h); s.h = h; };
  $('w-add').onclick = () => { addInstance(s); toast(`Added "${s.name}" to the stage`); renderInspector(); };
  $('i-dup').onclick = () => { const c = JSON.parse(JSON.stringify(s)); c.id = state.nextId++; c.name = s.name + ' copy'; c.x += 24; c.y += 24; state.symbols.push(c); state.sel = c.id; renderInspector(); };
  $('i-del').onclick = deleteSelection;
}
function renderInspector(skipMarkers) {
  if (!skipMarkers) renderMarkers();
  if (state.mode === 'workshop') return renderWorkshopInspector();
  const el = $('inspector'), s = sel();
  if (!s && state.selIds.length > 1) {   // several shapes selected: group actions
    const n = state.selIds.length;
    el.innerHTML = `
      <h3>${n} shapes selected</h3>
      <div class="row"><button id="m-dup">Duplicate</button><button id="m-del">Remove from stage</button></div>
      <h3>Events (over time)</h3>
      <button id="i-addev" ${audio.duration ? '' : 'disabled title="Upload audio first"'}>+ Event for all ${n} at playhead (M)</button>
      <p class="dim">Drag any selected shape to move them together; Delete removes them all. Shift-click or shift-drag adds or removes shapes. Select a single shape to edit it.</p>`;
    $('i-addev').onclick = addEvent;
    $('m-del').onclick = deleteSelection;
    $('m-dup').onclick = () => {
      const copies = selShapes().map(o => { const c = JSON.parse(JSON.stringify(o)); c.id = state.nextId++; c.x += 20; c.y += 20; return c; });
      state.stage.push(...copies); state.selIds = copies.map(c => c.id); renderInspector();
    };
    return;
  }
  if (!s) { el.innerHTML = `<h3>Stage</h3><p class="dim">Bring shapes in from the library tray below (click, or drag onto the stage), then arrange them with Select. Upload a track and press Play: click shapes as the music plays to mark when they appear and disappear. The Transform tool (X) turns one shape into another over time. Draw and restyle shapes in the Workshop.</p>
      <p class="dim">${state.stage.length} on the stage, ${state.symbols.length} in the library.</p>`; return; }
  const evs = s ? state.events.filter(e => e.shapeIds.includes(s.id) || e.id === state.selEvent).sort((a, b) => a.time - b.time) : [];
  const GLYPH = { path: '✎', rect: '▭', ellipse: '◯', triangle: '△' };
  const opt = (obj, cur) => (Array.isArray(obj) ? obj.map(k => [k, k]) : Object.entries(obj))
    .map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`).join('');
  el.innerHTML = `
    <h3>On stage</h3>
    <div class="row"><span>Shape</span><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc((symbolOf(s) || {}).name || s.type)}</b><button id="s-edit" title="Change its look in the Workshop">Edit in Workshop</button></div>
    <div class="row"><span>Width</span><input type="number" id="i-w" value="${Math.round(s.w)}"></div>
    <div class="row"><span>Height</span><input type="number" id="i-h" value="${Math.round(s.h)}"></div>
    <div class="row"><span>Rotation</span><input type="number" id="i-rot" value="${Math.round(s.rot)}"></div>
    <div class="row"><span>Opacity</span><input type="range" id="i-op" min="0" max="1" step="0.01" value="${s.opacity}"></div>
    <div class="row"><button id="i-up">Forward</button><button id="i-down">Back</button><button id="i-dup">Duplicate</button><button id="i-del">Remove</button></div>
    <h3>Events (over time)</h3>
    ${evs.map(e => `
      <div class="evrow ${e.id === state.selEvent ? 'sel' : ''}" data-ev="${e.id}">
        <input type="number" step="0.1" min="0" data-k="time" value="${e.time.toFixed(2)}"><span class="dim">s</span>
        <select data-k="action">${opt(EVENT_ACTIONS, e.action)}</select>
        <button data-rmev="${e.id}" title="Remove">×</button>
        <div class="chips" title="Shapes this event affects">${state.shapes.map(x =>
          `<button class="chip ${e.shapeIds.includes(x.id) ? 'inc' : ''}" data-chip="${x.id}" style="--c:${x.fill}" title="${x.type} #${x.id}">${GLYPH[x.type] || '?'}</button>`).join('')}
          <button class="chip all" data-chip="all" title="All shapes">all</button></div>
      </div>`).join('')}
    <button id="i-addev" ${audio.duration ? '' : 'disabled title="Upload audio first"'}>+ Event at playhead (M)</button>
    <p class="dim">Events show/hide shapes at moments in the song, drawn as lines on the timeline. While the track plays, click a shape to mark it right then: the first click shows it, the next hides it, and so on (change an event with its dropdown). Drag a box to mark a group at once, or tap other shapes' chips on an event to include them. M marks the selected shapes. A shape whose first event is Show starts hidden.</p>`;
  // transformations involving this shape
  const xfs = state.transforms.filter(x => x.from === s.id || x.to === s.id || x.id === state.selXf);
  const shapeLabel = q => `${GLYPH[q.type] || '?'} #${q.id}`;
  el.insertAdjacentHTML('beforeend', `
    <h3>Transformations</h3>
    ${xfs.map(x => { const A = state.shapes.find(q => q.id === x.from), B = state.shapes.find(q => q.id === x.to); return `
      <div class="xfrow ${x.id === state.selXf ? 'sel' : ''}" data-xf="${x.id}">
        <span title="turns into">${A ? shapeLabel(A) : '?'} &rarr;</span>
        <select data-k="to">${x.to == null ? '<option value="">(pick the target)</option>' : ''}${state.shapes.filter(q => q.id !== x.from).map(q => `<option value="${q.id}" ${q.id === x.to ? 'selected' : ''}>${shapeLabel(q)} ${q.type}</option>`).join('')}</select>
        <button data-rmxf="${x.id}" title="Remove">×</button>
        <input type="number" step="0.1" min="0" data-k="start" value="${x.start.toFixed(2)}"><span class="dim">to</span>
        <input type="number" step="0.1" min="0" data-k="end" value="${x.end != null ? x.end.toFixed(2) : ''}" ${x.end == null ? 'placeholder="…"' : ''}><span class="dim">s</span>
      </div>`; }).join('')}
    <button id="i-addxf">Transform tool (X)</button>
    <p class="dim">Turn this shape into another over time: with the Transform tool click the shape at the moment it should start changing, click the shape it becomes, then click anywhere to stop. The destination appears as the change finishes.</p>`);
  $('i-addxf').onclick = () => { setTool('transform'); };
  el.querySelectorAll('.xfrow').forEach(row => {
    const x = state.transforms.find(q => q.id === +row.dataset.xf);
    row.querySelector('[data-k=start]').oninput = ev => { x.start = Math.max(0, +ev.target.value || 0); if (x.end != null && x.end <= x.start) x.end = x.start + 0.1; renderMarkers(); };
    row.querySelector('[data-k=end]').oninput = ev => { const v = +ev.target.value; if (v > x.start) { x.end = v; renderMarkers(); } };
    row.querySelector('[data-k=to]').oninput = ev => { x.to = +ev.target.value || null; renderMarkers(); };
    row.querySelector('[data-rmxf]').onclick = () => { if (x.id === state.pendingXf) state.pendingXf = null; state.transforms = state.transforms.filter(q => q !== x); state.selXf = null; updateBanner(); renderInspector(); };
    row.onclick = ev => { if (ev.target === row || ev.target.tagName === 'SPAN') { state.selXf = x.id; renderInspector(); } };
  });
  const bind = (id, fn) => $(id).oninput = e => fn(e.target);
  $('s-edit').onclick = () => { const q = symbolOf(s); setMode('workshop'); if (q) { state.sel = q.id; renderInspector(); } };
  bind('i-w', t => s.w = Math.max(1, +t.value));
  bind('i-h', t => s.h = Math.max(1, +t.value));
  bind('i-rot', t => s.rot = +t.value);
  bind('i-op', t => s.opacity = +t.value);
  const reorder = d => { const i = state.shapes.indexOf(s), j = i + d; if (j >= 0 && j < state.shapes.length) { state.shapes.splice(i, 1); state.shapes.splice(j, 0, s); } };
  $('i-up').onclick = () => reorder(1);
  $('i-down').onclick = () => reorder(-1);
  $('i-dup').onclick = () => { const c = JSON.parse(JSON.stringify(s)); c.id = state.nextId++; c.x += 20; c.y += 20; state.stage.push(c); state.sel = c.id; renderInspector(); };
  $('i-del').onclick = deleteSelection;
  $('i-addev').onclick = addEvent;
  el.querySelectorAll('.evrow').forEach(row => {
    const e = state.events.find(x => x.id === +row.dataset.ev);
    row.querySelector('[data-k=time]').oninput = ev => { e.time = Math.max(0, +ev.target.value || 0); renderMarkers(); };
    row.querySelector('[data-k=action]').oninput = ev => { e.action = ev.target.value; renderMarkers(); };
    row.querySelectorAll('[data-chip]').forEach(ch => ch.onclick = () => {
      const id = ch.dataset.chip;
      if (id === 'all') e.shapeIds = state.shapes.map(x => x.id);
      else if (e.shapeIds.includes(+id)) { if (e.shapeIds.length > 1) e.shapeIds = e.shapeIds.filter(x => x !== +id); }   // keep at least one
      else e.shapeIds.push(+id);
      state.selEvent = e.id; renderInspector();
    });
    row.querySelector('[data-rmev]').onclick = () => { state.events = state.events.filter(x => x !== e); state.selEvent = null; renderInspector(); };
    row.onclick = ev => { if (ev.target === row || ev.target.tagName === 'SPAN') { state.selEvent = e.id; renderInspector(); } };
  });
}

// ---------- main loop ----------
function frame() {
  draw(); updateTime();
  requestAnimationFrame(frame);
}

restoreSaved();
setMode(state.stage.length ? 'stage' : 'workshop');
frame();
</script>
</body>
</html>
